name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# أقل صلاحية على مستوى الملف. كانت pages:write و id-token:write معلنتين هنا
# فتسريان على تشغيلات الـPR أيضاً، ووظيفة الاختبارات لا تحتاج إلا القراءة.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # التاريخ كاملاً: فحص CACHE_NAME يقارن بالأساس
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # يمنع انحراف الـsprite عن ملفات SVG المصدرية
      - name: Verify sprite is up to date
        run: |
          node tools/build-sprite.js
          if ! git diff --quiet -- assets/sprite.svg; then
            echo "::error::assets/sprite.svg قديم — شغّل: npm run build:sprite"
            git diff --stat -- assets/sprite.svg
            exit 1
          fi

      # يمنع خلط index.html جديد مع JS قديم من مخزن الـService Worker
      - name: Verify CACHE_NAME was bumped
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node tools/check-cache-version.js "$BASE"

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # الطابور للنشر وحده: على مستوى الملف كانت تشغيلات اختبار الـPR تنتظر
    # خلف النشر وتسبقه بلا داعٍ
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ملفات التطوير لا تُنشر: أداة توليد الأيقونات (41KB) وصفحة المعاينة
      # والاختبارات كانت تُرفع كلها مع الموقع
      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp -r assets css js index.html manifest.json sw.js .nojekyll _site/
          echo "حجم ما سيُنشر:"
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
